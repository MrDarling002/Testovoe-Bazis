services:
  mysql:
    image: mysql:8.0
    container_name: task_service_mysql
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task_service
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      # Bound to localhost only: the database must not be reachable from
      # outside the host in any environment.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: task_service_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  email-mock:
    image: mendhak/http-https-echo:31
    container_name: task_service_email_mock
    environment:
      HTTP_PORT: 9000
    ports:
      - "127.0.0.1:9000:9000"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_service_api
    restart: unless-stopped
    environment:
      CONFIG_PATH: /etc/app/config.yaml
      DB_DSN: "app:app@tcp(mysql:3306)/task_service?parseTime=true&loc=UTC"
      REDIS_ADDR: "redis:6379"
      # Development-only secret. In production inject a random value from a
      # secret manager; the service refuses to start with a short secret.
      JWT_SECRET: "local-dev-only-secret-0123456789abcdef"
      EMAIL_BASE_URL: "http://email-mock:9000"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      email-mock:
        condition: service_started
    volumes:
      - ./config/config.yaml:/etc/app/config.yaml:ro

volumes:
  mysql_data:
  redis_data:
