# Base configuration. Deployment-specific and secret values are supplied via
# environment variables: DB_DSN, REDIS_ADDR, REDIS_PASSWORD, JWT_SECRET,
# EMAIL_BASE_URL, SERVER_ADDR, CONFIG_PATH.
server:
  addr: ":8080"

db:
  dsn: "app:app@tcp(mysql:3306)/task_service?parseTime=true&loc=UTC"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  addr: "redis:6379"
  password: ""
  db: 0

jwt:
  # The secret is intentionally NOT set here: provide it via JWT_SECRET.
  # The service fails to start if the secret is missing or shorter than
  # 32 characters.
  ttl: 24h

rate_limit:
  requests_per_minute: 100

cache:
  tasks_ttl: 5m

email:
  base_url: "http://email-mock:9000"
  timeout: 3s
